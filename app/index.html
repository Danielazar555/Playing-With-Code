<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1c2b">
<title>Philippines · 20 nights</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏝️%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="tb-l">
      <span class="tb-emoji">🏝️</span>
      <div>
        <div class="tb-title" id="tbTitle">Philippines</div>
        <div class="tb-sub" id="tbSub">20 nights · Feb 2027</div>
      </div>
    </div>
    <div class="tb-r">
      <span class="net-dot" id="netDot" role="img" aria-label="offline-ready"></span>
      <button class="tb-cd" id="countdown" aria-label="Days until departure"></button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="today"    class="active"><span>◎</span>Today</button>
    <button data-tab="plan"><span>▤</span>Plan</button>
    <button data-tab="map"><span>◈</span>Map</button>
    <button data-tab="money"><span>₱</span>Money</button>
    <button data-tab="kit"><span>✲</span>Kit</button>
  </nav>
</div>

<script src="data/coast.js"></script>
<script src="data/trip.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
