<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04182f">
<title>Palawan — trip companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧭%3C/text%3E%3C/svg%3E">
<!-- Palawan trip companion — self-contained build (2026-08-30).
     Everything is inlined: no server, no network, no dependencies.
     Open this file directly in a browser. -->
<style>
/* ===========================================================
   PALAWAN — design system
   Expedition-log identity, built to native-app standards.

   Structure follows UI/UX Pro Max `pro-rules.md` (its
   "UI doesn't look professional" reference):
     · 4/8pt spacing rhythm, tokenised
     · icon size + stroke tokens (20/24, one stroke width)
     · elevation from surface lightness, not glow shadows
     · press feedback that never shifts layout bounds
     · grouped inset lists instead of floating card stacks
     · one interactive accent; brass reserved for "earned"
   =========================================================== */

:root{
  /* ---- ground & surfaces: tropical ocean, flag blue deepened ---- */
  --bg:#04182f;
  --bg-hi:#0a2547;               /* top-of-screen lift */
  --s1:#0a2547;                  /* grouped-list surface */
  --s2:#123763;                  /* raised / pressed */
  --hair:rgba(255,255,255,.075); /* row dividers */
  --line:rgba(255,255,255,.11);  /* container borders */
  --line-str:rgba(255,255,255,.17);

  /* ---- text (all AA-verified on the grounds above) ---- */
  --ink:#f4f9ff;
  --ink-2:#b3cbe6;
  --ink-3:#8fabc9;

  /* ---- Philippine flag palette ----
     blue #0038A8 · red #CE1126 · sun #FCD116 · white
     True red is too dark for text on these grounds, so it fills only;
     --alert is the AA-safe text tint. */
  --flag-blue:#0038a8;
  --flag-red:#ce1126;
  --sun:#fcd116;                 /* the flag sun — energy & earned */
  --sun-soft:#ffd54a;
  --sun-wash:rgba(252,209,22,.14);
  --accent:#3fd9e4;              /* lagoon — interactive */
  --accent-dim:#1c9fae;
  --accent-wash:rgba(63,217,228,.14);
  --brass:var(--sun);            /* legacy alias */
  --brass-wash:var(--sun-wash);

  /* semantic status */
  --ok:#43d68b;
  --warn:#ffd54a;
  --bad:#ff7b6b;
  --info:#6fb2f0;
  --plum:#e79ae0;

  /* ---- spacing: 4/8pt rhythm ---- */
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px;
  --sp5:20px; --sp6:24px; --sp7:32px; --sp8:40px;

  /* ---- radius ---- */
  --rad-sm:10px; --rad:12px; --rad-lg:16px; --rad-xl:20px;

  /* ---- icons: two sizes, one stroke ---- */
  --icon-sm:20px; --icon-md:24px; --stroke:2;   /* Lucide is drawn on a 24px grid at stroke 2 */

  /* ---- motion ---- */
  --t-fast:120ms; --t:200ms; --ease:cubic-bezier(.2,.7,.3,1);

  /* ---- one shadow, only for things that truly float ---- */
  --lift:0 12px 32px -14px rgba(0,0,0,.75);

  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --tab-h:56px;
  --gutter:16px;

  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Hoefler Text",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,monospace;
  font-family:var(--sans);
}
@media (min-width:480px){ :root{ --gutter:22px } }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:none}
body{font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
a{color:var(--accent);text-decoration:none}
input,select{font-family:inherit;font-size:16px}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
*:focus:not(:focus-visible){outline:none}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* icons — one family, one stroke, two sizes */
svg.ic{width:var(--icon-md);height:var(--icon-md);flex:0 0 auto;stroke:currentColor;fill:none;
  stroke-width:var(--stroke);stroke-linecap:round;stroke-linejoin:round}
svg.ic-sm{width:var(--icon-sm);height:var(--icon-sm)}

/* =========================================================
   APP FRAME
   ========================================================= */
#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative;
  background:linear-gradient(180deg,#0d3a63 0%,#0a2547 34%,var(--bg) 62%)}
/* chart graticule: whisper-quiet, top only */
#app::before{content:"";position:absolute;left:0;right:0;top:0;height:340px;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.topbar,#view,.tabbar{position:relative;z-index:1}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--sp3);
  padding:calc(var(--sp3) + var(--safe-t)) var(--gutter) var(--sp3)}
.tb-l{display:flex;align-items:center;gap:var(--sp3);min-width:0}
.tb-mark{width:34px;height:34px;flex:0 0 auto;border-radius:var(--rad-sm);display:flex;
  align-items:center;justify-content:center;color:var(--brass);
  background:var(--brass-wash);border:1px solid rgba(233,189,106,.22)}
.tb-mark .ic{width:19px;height:19px}
.tb-title{font-size:17px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.tb-sub{font-size:11px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em;
  text-transform:uppercase;margin-top:1px}
.tb-r{display:flex;align-items:center;gap:var(--sp3)}
.net-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.net-dot.off{background:var(--ink-3)}
.tb-cd{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--rad-sm);padding:7px 11px;font-size:12px;font-weight:600;white-space:nowrap;
  font-family:var(--mono);letter-spacing:.02em;min-height:34px}

/* ---- scroll body ---- */
#view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:0 var(--gutter) calc(var(--tab-h) + var(--safe-b) + var(--sp7))}
#view.nopad{padding:0}

/* section label — quiet, uppercase, no decorative rule */
.section-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);
  font-weight:600;margin:var(--sp6) 0 var(--sp2);padding:0 var(--sp1)}

/* =========================================================
   SURFACES
   ========================================================= */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  padding:var(--sp4);margin-bottom:var(--sp2)}
.card.tap{transition:background var(--t-fast) var(--ease)}
.card.tap:active{background:var(--s2)}   /* no transform — never shift bounds */

.progress{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;
  margin:var(--sp2) 0 var(--sp3)}
.progress i{display:block;height:100%;background:var(--accent);border-radius:2px;
  transition:width var(--t) var(--ease)}

.center-mut{text-align:center;color:var(--ink-3);font-size:12.5px;margin:var(--sp6) 0 var(--sp4);line-height:1.5}
.link-btn{display:flex;align-items:center;justify-content:center;gap:var(--sp2);width:100%;
  min-height:44px;background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  color:var(--accent);font-size:14px;font-weight:600;margin-bottom:var(--sp2);
  transition:background var(--t-fast) var(--ease)}
.link-btn:active{background:var(--s2)}

/* ---- tab bar ---- */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));
  padding-bottom:var(--safe-b);display:flex;background:rgba(7,20,25,.86);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--hair);z-index:6}
.tabbar button{flex:1;color:var(--ink-3);font-size:10px;font-weight:500;letter-spacing:.01em;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  transition:color var(--t-fast) var(--ease)}
.tabbar button .ic{width:23px;height:23px;stroke-width:1.7}
.tabbar button.active{color:var(--accent)}

/* Inset list group: turns a run of .card / .quest into one grouped
   list with hairline dividers — the native pattern, no floating stack. */
.list-group{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;margin-bottom:var(--sp2)}
.list-group > .card{background:transparent;border:none;border-radius:0;margin:0}
.list-group > .card + .card{border-top:1px solid var(--hair)}
.list-group > .card.tap:active{background:var(--s2)}
.list-group > .quest{padding-left:var(--sp4);padding-right:var(--sp4)}

/* =========================================================
   TODAY
   ========================================================= */
.hero{border-radius:var(--rad-lg);padding:var(--sp5);margin:var(--sp2) 0 var(--sp4);
  position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(178deg,#1b6fa8 0%,#12558c 38%,#0c3c68 100%);
  min-height:230px;display:flex;flex-direction:column;justify-content:flex-end}
.hero > *{position:relative;z-index:2}
/* scrim: keeps copy legible over the water without dulling the scene */
.hero::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(4,24,47,0) 22%,rgba(4,24,47,.42) 52%,rgba(4,24,47,.78) 100%)}
.hero .eyebrow{font-size:11px;color:#ffe07a;text-transform:uppercase;letter-spacing:.14em;
  font-weight:700;font-family:var(--mono)}
.hero h2{margin:var(--sp2) 0 var(--sp1);font-size:31px;line-height:1.05;font-family:var(--display);
  font-weight:600;letter-spacing:-.015em;text-wrap:balance;color:#fff;
  text-shadow:0 2px 18px rgba(4,24,47,.5)}
.hero .where{color:#dcefff;font-size:13.5px;margin-bottom:var(--sp3);
  display:flex;align-items:center;gap:5px;font-weight:600}
.hero .where svg{color:var(--sun);width:16px;height:16px}
.hero p{color:#e6f4ff;margin:0;font-size:14.5px;line-height:1.5;
  text-shadow:0 1px 10px rgba(4,24,47,.45)}

/* ---- the scene: sky, Philippine sun, islands, moving water ---- */
.scene{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  border-radius:inherit}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.scene .sun-grp{transform-origin:320px 52px;animation:spin 90s linear infinite}
.scene .sun-disc{fill:var(--sun)}
.scene .sun-ray{fill:var(--sun);opacity:.85}
.scene .sun-glow{fill:url(#glow)}
.scene .isle{fill:#052744;opacity:.9}
.scene .palm{stroke:#052744;stroke-width:2;fill:none;stroke-linecap:round}
.wave{animation:drift 14s linear infinite}
.wave.w2{animation-duration:20s;animation-direction:reverse}
.wave.w3{animation-duration:27s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@media (prefers-reduced-motion:reduce){
  .scene .sun-grp,.wave{animation:none}
}

.pill-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp4);position:relative}
.pill{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.11);color:#e4f1f2;
  border-radius:var(--rad-sm);padding:6px 10px;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px}
.leg-dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 auto}
.next-up{display:flex;gap:var(--sp3);align-items:center;margin-top:var(--sp3)}

/* score — the one brass moment */
.pts-strip{display:flex;align-items:center;gap:var(--sp3);background:var(--s1);
  border:1px solid var(--line);border-radius:var(--rad);padding:var(--sp3) var(--sp4);
  margin-bottom:var(--sp2);transition:background var(--t-fast) var(--ease)}
.pts-strip:active{background:var(--s2)}
.pts-badge{width:38px;height:38px;flex:0 0 auto;border-radius:var(--rad-sm);background:var(--brass-wash);
  border:1px solid rgba(233,189,106,.22);color:var(--brass);
  display:flex;align-items:center;justify-content:center}
.pts-badge .ic{width:19px;height:19px}
.pts-badge b{display:none}
.pts-body{flex:1;min-width:0}
.pts-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp2);margin-bottom:6px}
.pts-top b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.pts-top span{color:var(--ink-3);font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.pts-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.pts-bar i{display:block;height:100%;border-radius:2px;
  background:linear-gradient(90deg,#ff9d3d,var(--sun));box-shadow:0 0 10px rgba(252,209,22,.55);
  transition:width var(--t) var(--ease)}
.pts-arrow{color:var(--ink-3);display:flex}
.pts-arrow .ic{width:18px;height:18px}

/* nudge / callout / tip — one anatomy */
.nudge,.callout,.tip{display:flex;gap:var(--sp3);align-items:flex-start}
.nudge,.callout{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  padding:var(--sp4);margin-bottom:var(--sp2)}
.nudge{border-left:2px solid var(--accent)}
.callout{border-left:2px solid var(--warn)}
.nudge-ic,.callout .ic,.tip-ic{width:var(--icon-md);height:var(--icon-md);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.nudge-ic{color:var(--accent)}
.callout .ic{color:var(--warn)}
.tip-ic{color:var(--accent)}
.nudge .t,.callout .t,.tip .t{font-weight:600;font-size:15px;letter-spacing:-.01em}
.callout .t{color:var(--warn)}
.nudge .b,.callout .b,.tip .b{font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.5}

/* =========================================================
   PLAN
   ========================================================= */
.hub-strip{display:flex;gap:var(--sp2);overflow-x:auto;padding:var(--sp1) var(--gutter) var(--sp3);
  margin:0 calc(var(--gutter) * -1);scrollbar-width:none}
.hub-strip::-webkit-scrollbar{display:none}
.hub-chip{flex:0 0 auto;background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  padding:var(--sp3);min-width:112px;text-align:left;transition:background var(--t-fast) var(--ease)}
.hub-chip:active{background:var(--s2)}
.hub-chip .hc-n{font-weight:600;font-size:14px;letter-spacing:-.01em}
.hub-chip .hc-x{font-size:11.5px;color:var(--ink-3);margin-top:1px;font-variant-numeric:tabular-nums}
.hub-chip .hc-bar{height:3px;border-radius:2px;margin-top:var(--sp2);background:var(--line)}

.day{display:flex;gap:var(--sp3)}
.day-rail{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;width:10px}
.day-dot{width:9px;height:9px;border-radius:50%;margin-top:19px;flex:0 0 auto}
.day-line{flex:1;width:1.5px;background:var(--hair);margin:var(--sp1) 0}
.day-c{flex:1;min-width:0}
.day-top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp2)}
.day-date{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.day-hub{font-size:11px;color:var(--ink-3)}
.day-title{font-weight:600;font-size:16px;margin:5px 0 3px;letter-spacing:-.015em}
.day-body{color:var(--ink-2);font-size:14px;line-height:1.5}
.type-tag{font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;text-transform:uppercase;
  letter-spacing:.05em;white-space:nowrap;background:rgba(255,255,255,.07);color:var(--ink-3)}
.t-highlight{background:var(--brass-wash);color:var(--brass)}
.t-beach{background:var(--brass-wash);color:var(--brass)}
.t-dive{background:rgba(107,182,232,.13);color:var(--info)}
.t-travel{background:rgba(78,203,144,.13);color:var(--ok)}
.t-transit{background:rgba(255,255,255,.07);color:var(--ink-3)}
.t-rest{background:rgba(215,156,226,.13);color:var(--plum)}
.t-expedition{background:rgba(255,138,118,.13);color:var(--bad)}
.day-pins{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--sp3)}
.mini-pin{font-size:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:8px;padding:5px 9px;color:var(--ink-2);transition:background var(--t-fast) var(--ease)}
.mini-pin:active{background:var(--s2)}
.mini-pin b{color:var(--accent);font-weight:600}

.cal-btn{width:100%;min-height:48px;background:linear-gradient(100deg,var(--accent),#57e3c8);color:#04222a;border-radius:var(--rad);
  font-weight:600;font-size:15px;letter-spacing:-.01em;margin:var(--sp3) 0 var(--sp2);
  display:flex;align-items:center;justify-content:center;gap:var(--sp2);
  transition:filter var(--t-fast) var(--ease)}
.cal-btn:active{filter:brightness(.92)}
.cal-btn .ic{color:#04222a;width:20px;height:20px}

/* =========================================================
   MAP
   ========================================================= */
.map-host{position:relative;width:100%;height:100%;touch-action:none;overflow:hidden;
  background:radial-gradient(130% 115% at 50% -5%,#12303a,#091a22 58%,#07161d)}
.map-host.grab{cursor:grabbing}
.map-svg{width:100%;height:100%;display:block;position:relative;z-index:1;
  /* letter-spacing inherits as an ABSOLUTE length; body's -.01em resolves to
     -0.16px, which exceeds the glyph advance at this SVG's ~0.18px font size
     and renders label text backwards. Reset it for all SVG text. */
  letter-spacing:normal}
.map-svg .sea{fill:#0a1e26}
.map-svg .land path{fill:#173029;stroke:#2b5a4a;stroke-width:0;paint-order:stroke;stroke-linejoin:round}
.map-svg .route .halo{stroke:#07161d;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
.map-svg .route .line{stroke:var(--brass);stroke-linecap:round;stroke-linejoin:round}
.map-svg circle.pin{stroke:#07161d;cursor:pointer;transition:r var(--t-fast) var(--ease)}
.map-svg circle.pin.dim{opacity:.25}
.map-svg circle.pin.sel{stroke:#fff}
.map-svg circle.pin:focus-visible{stroke:#fff;outline:none}
.map-svg circle.hub{stroke:var(--ink);cursor:pointer}
.map-svg .hub-label{fill:var(--ink);stroke:#07161d;stroke-linejoin:round;paint-order:stroke;
  font-weight:600;dominant-baseline:middle;pointer-events:none;font-family:var(--sans)}

.map-ctl{position:absolute;right:var(--sp3);top:76px;display:flex;flex-direction:column;gap:var(--sp2);z-index:4}
.map-ctl button{width:40px;height:40px;border-radius:var(--rad-sm);background:rgba(13,32,41,.9);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);
  color:var(--ink);font-size:18px;font-weight:500;display:flex;align-items:center;justify-content:center;
  transition:background var(--t-fast) var(--ease)}
.map-ctl button:active{background:var(--s2)}
.map-topbar{position:absolute;left:0;right:0;top:0;z-index:4;padding:var(--sp3) var(--sp3) var(--sp5);
  background:linear-gradient(180deg,rgba(7,22,29,.94),transparent);pointer-events:none}
.map-modes{display:flex;gap:6px;pointer-events:auto;overflow-x:auto;scrollbar-width:none}
.map-modes::-webkit-scrollbar{display:none}
.mode-chip{flex:0 0 auto;background:rgba(13,32,41,.86);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--ink-2);
  border-radius:var(--rad-sm);padding:0 13px;min-height:38px;display:flex;align-items:center;gap:6px;
  font-size:13px;font-weight:600;white-space:nowrap;letter-spacing:-.01em;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.mode-chip .ic{width:16px;height:16px}
.mode-chip.on{background:var(--accent);border-color:var(--accent);color:#04222a}
.map-filters{position:absolute;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b));z-index:4;
  padding:var(--sp5) var(--sp3) var(--sp3);background:linear-gradient(0deg,rgba(7,22,29,.95),transparent)}
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;background:rgba(13,32,41,.82);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border:1px solid var(--line);color:var(--ink-2);
  border-radius:var(--rad-sm);padding:0 11px;min-height:34px;font-size:12.5px;font-weight:600;
  white-space:nowrap;display:flex;align-items:center;gap:6px;letter-spacing:-.01em;
  transition:opacity var(--t-fast) var(--ease)}
.fchip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.fchip.off{opacity:.35}

.map-pop{position:absolute;z-index:5;width:min(276px,76vw);background:var(--s1);
  border:1px solid var(--line-str);border-radius:var(--rad-lg);padding:var(--sp4);box-shadow:var(--lift)}
.map-pop h4{margin:3px 0 0;font-size:17px;font-weight:600;letter-spacing:-.02em}
.map-pop p{margin:var(--sp2) 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.pop-x{position:absolute;top:6px;right:6px;width:32px;height:32px;color:var(--ink-3);font-size:17px;
  display:flex;align-items:center;justify-content:center;border-radius:8px}
.pop-cat{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.pop-fee{font-size:12.5px;color:var(--brass);margin-top:6px;font-weight:600;font-variant-numeric:tabular-nums}
.pop-rec{font-size:12.5px;color:var(--ink-2);font-style:italic;margin-top:var(--sp2);line-height:1.45;
  padding-left:var(--sp2);border-left:2px solid var(--hair)}
.pop-act{display:flex;gap:var(--sp2);flex-wrap:wrap;align-items:center;margin-top:var(--sp3)}
.pop-act a{color:var(--accent);font-size:13px;font-weight:600;min-height:32px;display:flex;align-items:center}
.pop-save{background:var(--accent-wash);border:1px solid rgba(53,194,207,.28);color:var(--accent);
  border-radius:8px;padding:0 12px;min-height:32px;font-size:12.5px;font-weight:600;
  display:flex;align-items:center;transition:background var(--t-fast) var(--ease)}
.pop-save:active{background:rgba(53,194,207,.22)}

/* =========================================================
   MONEY
   ========================================================= */
.calc{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  padding:var(--sp4);margin-bottom:var(--sp3)}
.calc h3{margin:0 0 var(--sp4);font-size:16px;font-weight:600;letter-spacing:-.015em;
  display:flex;align-items:center;gap:var(--sp2)}
.calc h3 .ic{color:var(--accent);width:19px;height:19px}
.fx-row{display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap}
.fx-row input,.fx-row select{background:rgba(255,255,255,.06);border:1px solid var(--line);
  color:var(--ink);border-radius:var(--rad-sm);padding:11px 12px;min-height:46px;font-weight:500}
.fx-row input{flex:1;min-width:0}
.fx-row select{font-weight:600}
.fx-swap{width:46px;height:46px;flex:0 0 auto;border-radius:var(--rad-sm);background:var(--accent-wash);
  border:1px solid rgba(53,194,207,.24);color:var(--accent);font-size:16px;
  display:flex;align-items:center;justify-content:center}
#fxOut{font-size:30px;font-weight:600;color:var(--accent);margin:var(--sp3) 0 var(--sp2);
  letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.quick-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:var(--sp2)}
.quick-row button{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink-2);
  border-radius:var(--rad-sm);padding:0 12px;min-height:38px;font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;transition:background var(--t-fast) var(--ease)}
.quick-row button:active{background:var(--s2)}
.fx-note{font-size:12.5px;color:var(--ink-3);margin-top:var(--sp3);line-height:1.5}

.tip-calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.tc-out{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:var(--rad-sm);
  padding:var(--sp3);text-align:center}
.tc-out .v{font-size:19px;font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tc-out .l{font-size:11px;color:var(--ink-3);margin-top:2px}

.bud-row{display:flex;justify-content:space-between;gap:var(--sp3);padding:11px 0;
  border-bottom:1px solid var(--hair);font-size:14px}
.bud-row:last-of-type{border-bottom:none}
.bud-k{color:var(--ink-2)}
.bud-v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bud-total{display:flex;justify-content:space-between;gap:var(--sp3);padding-top:var(--sp3);
  margin-top:var(--sp1);border-top:1px solid var(--line-str);font-weight:600;font-size:15px}
.range-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-bottom:5px}
.bar{height:4px;border-radius:2px}

/* cash plan */
.cash-rules{margin-bottom:var(--sp2)}
.cash-rule{display:flex;gap:var(--sp2);font-size:13.5px;color:var(--ink-2);padding:10px 0;
  border-bottom:1px solid var(--hair);line-height:1.5}
.cash-rule:last-child{border-bottom:none}
.cash-rule .n{color:var(--brass);flex:0 0 auto}
.cash-phase{display:flex;gap:var(--sp3);align-items:flex-start;padding:var(--sp3) 0;
  border-bottom:1px solid var(--hair)}
.cash-phase:last-child{border-bottom:none}
.cash-risk{flex:0 0 auto;width:62px;text-align:center;border-radius:7px;padding:4px 3px;
  font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
.risk-Severe{background:rgba(255,138,118,.14);color:var(--bad)}
.risk-High{background:rgba(233,180,95,.14);color:var(--warn)}
.risk-Moderate{background:rgba(107,182,232,.14);color:var(--info)}
.cash-body{flex:1;min-width:0}
.cash-hub{font-weight:600;font-size:15px;letter-spacing:-.01em}
.cash-draw{font-size:13px;color:var(--ok);font-weight:600;margin-top:2px;display:flex;
  align-items:center;gap:6px}
.cash-draw .ic{width:16px;height:16px}
.cash-note{font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}

/* =========================================================
   KIT — grouped inset list (the native pattern)
   ========================================================= */
.kit-group{background:var(--s1);border:1px solid var(--line);border-radius:var(--rad);
  overflow:hidden;margin-bottom:var(--sp4)}
.kit-sec + .kit-sec{border-top:1px solid var(--hair)}
.kit-sec.open,.kit-sec.open + .kit-sec{border-top-color:var(--line)}
.kit-head{width:100%;display:flex;align-items:center;gap:var(--sp3);padding:var(--sp3) var(--sp4);
  min-height:60px;text-align:left;transition:background var(--t-fast) var(--ease)}
.kit-head:active{background:var(--s2)}
.kh-ic{width:30px;height:30px;flex:0 0 auto;border-radius:8px;color:#04182f;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px -3px rgba(0,0,0,.5)}
.kh-ic svg{stroke-width:2}
.kh-t{flex:1;font-size:16px;font-weight:600;letter-spacing:-.015em;display:flex;flex-direction:column;min-width:0}
.kh-sub{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--ink-3);margin-top:2px;
  text-transform:uppercase;letter-spacing:.03em}
.kh-x{color:var(--ink-3);display:flex}
.kh-x .ic{width:18px;height:18px;transition:transform var(--t) var(--ease)}
.kit-sec.open .kh-x .ic{transform:rotate(90deg)}
.kit-sec.open{background:rgba(255,255,255,.022)}
.kit-body{padding:0 var(--sp4) var(--sp4)}
.kit-lead{font-size:13.5px;color:var(--ink-2);margin-bottom:var(--sp4);line-height:1.5}
.kit-grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;margin:var(--sp4) 0 var(--sp2);display:flex;align-items:center;gap:var(--sp2)}
.grp-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.kit-empty{font-size:13.5px;color:var(--ink-3);line-height:1.55;padding:var(--sp2) 0}

/* quests — flat rows, not floating cards */
.quest{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp3) 0;
  border-bottom:1px solid var(--hair)}
.quest:last-child{border-bottom:none}
.q-check{width:30px;height:30px;border-radius:50%;border:1.75px solid var(--line-str);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);
  transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.q-check .ic{width:16px;height:16px}
.quest.done .q-check{background:var(--ok);border-color:var(--ok);color:#052018;font-weight:700}
.q-body{flex:1;min-width:0}
.q-t{font-weight:600;font-size:15px;letter-spacing:-.01em}
.quest.done .q-t{color:var(--ink-3)}
.q-h{font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.q-cam{width:36px;height:36px;flex:0 0 auto;border-radius:50%;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:background var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.q-cam:active{background:var(--s2);color:var(--accent)}
.q-cam.has{color:var(--ok)}
.q-cam.has::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;
  background:var(--ok);border:2px solid var(--s1)}
.q-pts{font-size:13px;font-weight:600;flex:0 0 auto;color:var(--ink-3);
  font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.quest.done .q-pts{color:var(--brass)}

/* passport */
.passport-empty{font-size:13.5px;color:var(--ink-3);line-height:1.55}
.stamp-grid{display:flex;flex-wrap:wrap;gap:var(--sp2)}
.stamp{width:62px;height:62px;border-radius:50%;border:1.5px dashed;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;background:rgba(255,255,255,.03)}
.stamp .ic{width:19px;height:19px}
.stamp b{font-size:8px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}

/* checklist / packing rows */
.check{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp3) 0;
  border-bottom:1px solid var(--hair);transition:opacity var(--t-fast) var(--ease)}
.check:last-child{border-bottom:none}
.check .box{width:24px;height:24px;flex:0 0 auto;border-radius:50%;border:1.75px solid var(--line-str);
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;
  transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.check.done .box{background:var(--ok);border-color:var(--ok);color:#052018;font-weight:700}
.check .lbl{flex:1;font-size:15px;letter-spacing:-.01em}
.check.done .lbl{color:var(--ink-3);text-decoration:line-through}
.check .u{font-size:9.5px;font-weight:700;color:var(--bad);background:rgba(255,138,118,.14);
  padding:3px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}

/* saved & journal */
.save-form{display:flex;flex-direction:column;gap:var(--sp2);margin-bottom:var(--sp4)}
.save-form input{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--rad-sm);padding:12px;min-height:46px}
.save-form input::placeholder{color:var(--ink-3)}
.qa-btn{min-height:44px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--rad-sm);font-size:13.5px;font-weight:600;padding:0 var(--sp3);white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:-.01em;
  transition:background var(--t-fast) var(--ease)}
.qa-btn:active{background:var(--s2)}
.qa-btn .ic{color:var(--accent);width:18px;height:18px}
.quick-add{display:flex;gap:6px;margin-bottom:var(--sp4)}
.quick-add .qa-btn{flex:1}
.j-thumb{background:var(--accent-wash);border:1px solid rgba(53,194,207,.2);border-radius:var(--rad-sm);
  padding:10px 12px;font-size:13px;color:var(--accent)}

.saved-item,.mem{display:flex;align-items:center;gap:var(--sp3);padding:var(--sp3) 0;
  border-bottom:1px solid var(--hair)}
.saved-item:last-child,.mem:last-child{border-bottom:none}
.si-ic{width:var(--icon-md);height:var(--icon-md);flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;color:var(--ink-3)}
.si-ic .ic{width:18px;height:18px}
.si-body{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere;letter-spacing:-.01em}
.si-body a{color:var(--accent)}
.si-del{flex:0 0 auto;color:var(--ink-3);width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;transition:background var(--t-fast) var(--ease)}
.si-del:active{background:var(--s2)}
.si-del .ic{width:16px;height:16px}
.mem-photo{flex:0 0 auto;width:56px;height:56px;border-radius:var(--rad-sm);overflow:hidden;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.mem-photo img{width:100%;height:100%;object-fit:cover;display:block}
.mem-photo.noimg::after{content:"";width:18px;height:18px;border-radius:4px;background:var(--line-str)}
.mem-body{flex:1;min-width:0}
.mem-t{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.mem-n{font-size:13px;color:var(--ink-2);margin-top:2px;line-height:1.45}

/* phrasebook */
.phrase{display:grid;grid-template-columns:1fr auto;gap:2px var(--sp3);padding:11px 0;
  border-bottom:1px solid var(--hair)}
.phrase:last-child{border-bottom:none}
.ph-en{font-size:13px;color:var(--ink-3)}
.ph-tl{font-weight:600;font-size:15.5px;grid-row:2;grid-column:1;letter-spacing:-.01em}
.ph-pr{font-family:var(--mono);font-size:11.5px;color:var(--accent);grid-column:2;grid-row:2;
  align-self:end;white-space:nowrap}

/* =========================================================
   TOAST
   ========================================================= */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + var(--sp4));
  transform:translateX(-50%) translateY(6px);background:rgba(20,44,53,.97);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--line-str);color:var(--ink);padding:11px 18px;border-radius:var(--rad-xl);
  font-size:14px;font-weight:600;letter-spacing:-.01em;box-shadow:var(--lift);opacity:0;
  pointer-events:none;transition:opacity var(--t) var(--ease),transform var(--t) var(--ease);
  z-index:20;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* =========================================================
   POINTER REFINEMENTS (desktop only — touch keeps :active)
   ========================================================= */
[role="button"],[role="checkbox"],.card.tap,.mini-pin,.hub-chip,.kit-head,.pts-strip,
.q-check,.q-body,.q-cam,.si-del,.check{cursor:pointer}
@media (hover:hover){
  .card.tap:hover,.pts-strip:hover,.kit-head:hover,.hub-chip:hover,.link-btn:hover,
  .qa-btn:hover,.quick-row button:hover,.map-ctl button:hover,.mini-pin:hover{background:var(--s2)}
  .mode-chip:hover:not(.on),.fchip:hover{background:rgba(21,44,53,.95)}
  .cal-btn:hover{filter:brightness(1.05)}
  .q-cam:hover,.si-del:hover{background:var(--s2);color:var(--accent)}
  .pop-save:hover{background:rgba(53,194,207,.2)}
  a:hover{text-decoration:underline}
}

@media (max-width:359px){
  :root{--gutter:13px}
  .hero h2{font-size:26px}
  #fxOut{font-size:26px}
}

/* selected state for segmented quick-choice buttons (tip %) */
.quick-row button.on{background:var(--accent);border-color:var(--accent);color:#04222a}

/* friendly empty-state scenes (same visual language as the hero) */
.empty-art{max-width:150px;margin:var(--sp3) auto var(--sp2);opacity:.95}
.empty-art svg{width:100%;height:auto;display:block}
.kit-empty,.passport-empty{text-align:center}

/* =========================================================
   Trip progress rail — where you are across the whole trip
   (Polarsteps / Atlas Obscura "been there" at a glance)
   ========================================================= */
.rail{position:relative;z-index:1;display:flex;gap:1.5px;height:3px;
  margin:0 var(--gutter) var(--sp2);border-radius:2px}
.rail i{display:block;height:100%;border-radius:2px;transition:opacity var(--t) var(--ease)}
.rail .rail-now{position:absolute;top:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;
  background:#fff;transform:translateY(-50%);box-shadow:0 0 0 2px var(--bg),0 0 10px rgba(255,255,255,.7)}

/* ---- journey numbers (real distances, haversine along the route) ---- */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;margin:var(--sp3) 0 var(--sp2)}
.stats-row .stat{background:var(--s1);padding:var(--sp3) var(--sp1);text-align:center}
.stats-row .stat b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--sun)}
.stats-row .stat span{display:block;font-size:9.5px;color:var(--ink-3);margin-top:2px;
  text-transform:uppercase;letter-spacing:.05em;line-height:1.25}

/* hop distance on travel days */
.hop{display:inline-flex;align-items:center;gap:5px;margin:2px 0 4px;font-size:11.5px;
  color:var(--ink-3);font-family:var(--mono);font-variant-numeric:tabular-nums}
.hop .ic{width:13px;height:13px;color:var(--accent)}

/* ---- entry motion: a short stagger on tab change only ---- */
@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
#view.enter > *{animation:rise .30s var(--ease) both}
#view.enter > *:nth-child(1){animation-delay:0ms}
#view.enter > *:nth-child(2){animation-delay:35ms}
#view.enter > *:nth-child(3){animation-delay:70ms}
#view.enter > *:nth-child(4){animation-delay:105ms}
#view.enter > *:nth-child(5){animation-delay:135ms}
#view.enter > *:nth-child(n+6){animation-delay:160ms}
@media (prefers-reduced-motion:reduce){ #view.enter > *{animation:none} }

</style>
</head>

/* ==== map.js ==== */
/* ============================================================
   TripMap — dependency-free SVG map.
   Renders real coastline geometry (window.COAST) + trip pins,
   with pan / zoom, an animated journey route, category filters,
   and click-to-open place cards. No tiles, works fully offline.
   ============================================================ */
(function () {
  const SVGNS = "http://www.w3.org/2000/svg";
  const R = 6371;

  // Equirectangular projection with latitude correction; y flipped for screen.
  function project(lng, lat, lat0) {
    const x = lng * Math.cos(lat0 * Math.PI / 180);
    const y = -lat;
    return [x, y];
  }
  // Haversine, km
  function dist(a, b) {
    const t = Math.PI / 180;
    const dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
    const la1 = a.lat * t, la2 = b.lat * t;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  const CAT = {
    beach:     { c:"#fcd116", g:"◗" },   // flag sun
    lagoon:    { c:"#3fd9e4", g:"❍" },   // lagoon
    viewpoint: { c:"#e79ae0", g:"▲" },
    food:      { c:"#ff7b6b", g:"●" },
    dive:      { c:"#6fb2f0", g:"✦" },
    transport: { c:"#a9c4dd", g:"✈" },
    camp:      { c:"#ffb347", g:"⌂" },
    town:      { c:"#8fabc9", g:"◉" },
    springs:   { c:"#ff9d6b", g:"♨" }
  };

  function el(tag, attrs, parent) {
    const n = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  function TripMap(host, trip, coast, opts) {
    this.host = host;
    this.trip = trip;
    this.coast = coast;
    this.opts = opts || {};
    this.lat0 = 11.4;               // reference latitude for x-correction
    this.filters = new Set(Object.keys(CAT));
    this.activeHub = null;          // hub id to zoom/limit to, or null = whole journey
    this.selectedPoi = null;
    this.onSelect = this.opts.onSelect || function () {};
    this._build();
    this.showJourney();
  }

  TripMap.prototype._build = function () {
    const h = this.host;
    h.innerHTML = "";
    h.classList.add("map-host");
    const svg = el("svg", { class:"map-svg", xmlns:SVGNS }, h);
    this.svg = svg;
    this.gSea = el("g", null, svg);
    this.gLand = el("g", { class:"land" }, svg);
    this.gRoute = el("g", { class:"route" }, svg);
    this.gPins = el("g", { class:"pins" }, svg);
    this.gLabels = el("g", { class:"labels" }, svg);

    // popup overlay (HTML, positioned over svg)
    this.pop = document.createElement("div");
    this.pop.className = "map-pop";
    this.pop.hidden = true;
    h.appendChild(this.pop);

    // zoom controls
    const ctl = document.createElement("div");
    ctl.className = "map-ctl";
    ctl.innerHTML =
      '<button data-a="in" aria-label="Zoom in">+</button>' +
      '<button data-a="out" aria-label="Zoom out">−</button>' +
      '<button data-a="fit" aria-label="Fit journey">⤢</button>';
    h.appendChild(ctl);
    ctl.addEventListener("click", (e) => {
      const a = e.target.dataset.a;
      if (a === "in") this._zoomBy(0.7);
      else if (a === "out") this._zoomBy(1.42);
      else if (a === "fit") this.activeHub ? this.focusHub(this.activeHub) : this.showJourney();
    });

    // interaction
    this._wire();
    this._ro = new ResizeObserver(() => this._applyView());
    this._ro.observe(h);
  };

  // ---- geometry helpers ----
  TripMap.prototype._pathFor = function (ring) {
    let d = "";
    for (let i = 0; i < ring.length; i++) {
      const [x, y] = project(ring[i][0], ring[i][1], this.lat0);
      d += (i ? "L" : "M") + x.toFixed(4) + " " + y.toFixed(4);
    }
    return d + "Z";
  };

  TripMap.prototype._drawLand = function (regions) {
    this.gLand.innerHTML = "";
    const seen = regions || Object.keys(this.coast);
    for (const key of seen) {
      const rings = this.coast[key];
      if (!rings) continue;
      for (const ring of rings) {
        el("path", { d: this._pathFor(ring) }, this.gLand);
      }
    }
  };

  // Compute a bounding box (projected) from a list of {lng,lat} points, with padding frac.
  TripMap.prototype._bboxOf = function (pts, pad, minSpan) {
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    for (const p of pts) {
      const [x,y] = project(p.lng, p.lat, this.lat0);
      minx=Math.min(minx,x); maxx=Math.max(maxx,x);
      miny=Math.min(miny,y); maxy=Math.max(maxy,y);
    }
    let w = maxx-minx || 0.2, hh = maxy-miny || 0.2;
    const p = pad==null?0.18:pad;
    minx-=w*p; maxx+=w*p; miny-=hh*p; maxy+=hh*p;
    // enforce a minimum extent so single-point clusters don't over-zoom
    const ms = minSpan || 0;
    if (ms) {
      const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
      if (maxx-minx < ms) { minx=cx-ms/2; maxx=cx+ms/2; }
      if (maxy-miny < ms) { miny=cy-ms/2; maxy=cy+ms/2; }
    }
    // keep aspect square-ish, expand smaller side
    w = maxx-minx; hh = maxy-miny;
    if (w < hh) { const d=(hh-w)/2; minx-=d; maxx+=d; }
    else { const d=(w-hh)/2; miny-=d; maxy+=d; }
    return { x:minx, y:miny, w:maxx-minx, h:maxy-miny };
  };

  TripMap.prototype._setView = function (box, animate) {
    this._view = box;
    this._applyView(animate);
  };

  // Robust pixel width of the map host (falls back before layout settles).
  TripMap.prototype._pxW = function () {
    const w = this.host.getBoundingClientRect().width || this.host.clientWidth || 0;
    return w > 20 ? w : 390;
  };

  TripMap.prototype._applyView = function (animate) {
    if (!this._view) return;
    const b = this._view;
    this.svg.setAttribute("viewBox", `${b.x} ${b.y} ${b.w} ${b.h}`);
    // sea background rect
    this.gSea.innerHTML = "";
    el("rect", { x:b.x-b.w, y:b.y-b.h, width:b.w*3, height:b.h*3, class:"sea" }, this.gSea);
    this._scalePins();
    this._layoutLabels();
    this._positionPop();
  };

  // Keep pin markers a constant screen size regardless of zoom.
  TripMap.prototype._scalePins = function () {
    if (!this._view) return;
    const scale = this._view.w / this._pxW(); // world units per px
    const r = 7 * scale;
    this._pinR = r;
    this.gPins.querySelectorAll("circle.pin").forEach(c => {
      c.setAttribute("r", c.classList.contains("star") ? r*1.25 : r);
      c.setAttribute("stroke-width", scale*1.6);
    });
    this.gPins.querySelectorAll("circle.hub").forEach(c => {
      c.setAttribute("r", r*1.7);
      c.setAttribute("stroke-width", scale*2.4);
    });
    this.gRoute.querySelectorAll("path,line").forEach(l => l.setAttribute("stroke-width", scale*2.2));
    this.gRoute.querySelectorAll("path.halo").forEach(l => l.setAttribute("stroke-width", scale*5));
  };

  // ---- rendering pins & routes ----
  TripMap.prototype._pinsForHub = function (hubId) {
    const out = [];
    for (const id in this.trip.pois) {
      const p = this.trip.pois[id];
      if (!hubId || p.hub === hubId) out.push([id, p]);
    }
    return out;
  };

  TripMap.prototype._drawPins = function (list) {
    this.gPins.innerHTML = "";
    for (const [id, p] of list) {
      if (!this.filters.has(p.cat)) continue;
      const [x, y] = project(p.lng, p.lat, this.lat0);
      const meta = CAT[p.cat] || CAT.town;
      const c = el("circle", {
        class: "pin" + (p.star ? " star" : ""),
        cx:x, cy:y, r:0.01, fill: meta.c,
        "data-id": id, tabindex: "0", role: "button",
        "aria-label": p.name + " — " + p.cat + (p.star ? ", highlight" : "")
      }, this.gPins);
      c.addEventListener("click", (e) => { e.stopPropagation(); this.openPoi(id); });
      c.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); this.openPoi(id); }
      });
    }
    this._scalePins();
  };

  TripMap.prototype._drawRoute = function (hubs) {
    this.gRoute.innerHTML = "";
    if (hubs.length < 2) { this._drawHubDots(hubs); return; }
    let d = "";
    hubs.forEach((hb, i) => {
      const [x, y] = project(hb.lng, hb.lat, this.lat0);
      d += (i ? "L" : "M") + x.toFixed(4) + " " + y.toFixed(4);
    });
    el("path", { d, class:"halo", fill:"none" }, this.gRoute);
    const line = el("path", { d, class:"line", fill:"none" }, this.gRoute);
    // dash-draw animation
    try {
      const len = line.getTotalLength();
      line.style.strokeDasharray = len;
      line.style.strokeDashoffset = len;
      line.getBoundingClientRect();
      line.style.transition = "stroke-dashoffset 1.1s ease";
      requestAnimationFrame(() => { line.style.strokeDashoffset = 0; });
    } catch (e) {}
    this._drawHubDots(hubs);
  };

  TripMap.prototype._drawHubDots = function (hubs) {
    this.gLabels.innerHTML = "";
    // Hubs at the same place (e.g. the two Mactan nights) would stack their
    // labels illegibly — give them one shared label instead: "1·6 Mactan".
    const seen = new Map();
    hubs.forEach((hb, i) => {
      const [x, y] = project(hb.lng, hb.lat, this.lat0);
      const c = el("circle", { class:"hub", cx:x, cy:y, r:0.02, fill: hb.color, "data-hub":hb.id }, this.gPins);
      c.addEventListener("click", (e) => { e.stopPropagation(); this.focusHub(hb.id); });

      const key = x.toFixed(3) + "," + y.toFixed(3);
      const prev = seen.get(key);
      if (prev) {
        prev.nums.push(i + 1);
        prev.el.textContent = prev.nums.join("·") + "  " + prev.name;
        return;
      }
      const name = hb.name.replace(/\s*\((arrival|departure)\)/i, "");
      const t = el("text", { class:"hub-label", "data-bx":x, "data-by":y, "data-hub":hb.id }, this.gLabels);
      t.textContent = (i + 1) + "  " + name;
      seen.set(key, { el: t, nums: [i + 1], name: name });
    });
    this._layoutLabels();
  };

  // Position + size labels from their stored base coords every view change
  // (absolute, so nothing compounds across pan/zoom frames).
  TripMap.prototype._layoutLabels = function () {
    if (!this._view) return;
    const scale = this._view.w / this._pxW();
    const off = (this._pinR || 0.05) * 1.7;
    this.gLabels.querySelectorAll("text").forEach(t => {
      const bx = +t.getAttribute("data-bx"), by = +t.getAttribute("data-by");
      t.setAttribute("x", bx + off);
      t.setAttribute("y", by + off * 0.3);
      t.setAttribute("font-size", 11 * scale);
      t.setAttribute("stroke-width", 1.5 * scale);   // ~14% of font size: readable halo, no glyph merge
    });
  };

  // ---- public view modes ----
  TripMap.prototype.showJourney = function () {
    this.activeHub = null;
    this._drawLand(); // all regions
    const hubs = this.trip.hubs;
    this._drawRoute(hubs);
    this._drawPins(this._pinsForHub(null).filter(([id,p]) => p.star || p.cat==="transport"));
    this._setView(this._bboxOf(hubs, 0.22));
    this.closePop();
  };

  TripMap.prototype.focusHub = function (hubId) {
    const hub = this.trip.hubs.find(h => h.id === hubId);
    if (!hub) return;
    this.activeHub = hubId;
    // detailed regional geometry only (overview is too coarse when zoomed in)
    this._drawLand([hub.region]);
    const pins = this._pinsForHub(hubId);
    this._drawRoute([hub]); // just the hub dot
    this._drawPins(pins);
    const pts = pins.map(([id,p]) => p).concat([hub]);
    this._setView(this._bboxOf(pts.length?pts:[hub], 0.28, 0.22));
    this.closePop();
    if (this.opts.onHub) this.opts.onHub(hubId);
  };

  TripMap.prototype.focusDay = function (day) {
    // Route/zoom to the pins of one day
    if (!day) return;
    if (day.hub) {
      const hub = this.trip.hubs.find(h => h.id === day.hub);
      if (hub) this._drawLand([hub.region]);
    }
    const pins = (day.pins||[]).map(id => [id, this.trip.pois[id]]).filter(x=>x[1]);
    this.activeHub = day.hub;
    this._drawPins(this._pinsForHub(day.hub));
    const hub = this.trip.hubs.find(h => h.id === day.hub);
    this._drawRoute(hub ? [hub] : []);
    const pts = pins.map(([id,p]) => p);
    if (hub) pts.push(hub);
    if (pts.length) this._setView(this._bboxOf(pts, 0.35, 0.12));
    // highlight the day's pins
    this.gPins.querySelectorAll("circle.pin").forEach(c => {
      c.classList.toggle("dim", !(day.pins||[]).includes(c.dataset.id));
    });
    if (pins.length) this.openPoi(pins[0][0], true);
  };

  TripMap.prototype.setFilter = function (cat, on) {
    if (on) this.filters.add(cat); else this.filters.delete(cat);
    if (this.activeHub) this._drawPins(this._pinsForHub(this.activeHub));
    else this._drawPins(this._pinsForHub(null).filter(([id,p]) => p.star || p.cat==="transport"));
  };

  // ---- POI popup ----
  TripMap.prototype.openPoi = function (id, keepView) {
    const p = this.trip.pois[id];
    if (!p) return;
    this.selectedPoi = id;
    const meta = CAT[p.cat] || CAT.town;
    const mapHref = p.url || ("https://www.google.com/maps/search/?api=1&query=" + p.lat + "," + p.lng);
    this.pop.innerHTML =
      `<button class="pop-x" aria-label="Close">×</button>` +
      `<div class="pop-cat" style="color:${meta.c}">${meta.g} ${p.cat}${p.star?' · ★ highlight':''}</div>` +
      `<h4>${p.name}</h4>` +
      (p.fee ? `<div class="pop-fee">💳 ${p.fee}</div>` : "") +
      `<p>${p.note||""}</p>` +
      (p.rec ? `<p class="pop-rec">“${p.rec}”</p>` : "") +
      `<div class="pop-act">` +
        `<a target="_blank" rel="noopener" href="${mapHref}">Open in Maps ↗</a>` +
        (p.book ? `<a target="_blank" rel="noopener" href="${p.book}">Book / info ↗</a>` : "") +
        (this.opts.onSave ? `<button class="pop-save" type="button">★ Save</button>` : "") +
      `</div>`;
    this.pop.hidden = false;
    this.pop.querySelector(".pop-x").addEventListener("click", () => this.closePop());
    const sv = this.pop.querySelector(".pop-save");
    if (sv) sv.addEventListener("click", (e) => { e.stopPropagation(); this.opts.onSave(id); });
    this._popTarget = [p.lng, p.lat];
    this._positionPop();
    // pulse the pin
    this.gPins.querySelectorAll("circle.pin").forEach(c => c.classList.toggle("sel", c.dataset.id===id));
    this.onSelect(id, p);
  };

  TripMap.prototype._positionPop = function () {
    if (this.pop.hidden || !this._popTarget || !this._view) return;
    const rect = this.host.getBoundingClientRect();
    const [lng, lat] = this._popTarget;
    const [wx, wy] = project(lng, lat, this.lat0);
    const px = (wx - this._view.x) / this._view.w * rect.width;
    const py = (wy - this._view.y) / this._view.h * rect.height;
    const pw = this.pop.offsetWidth || 240, ph = this.pop.offsetHeight || 140;
    let left = px - pw/2, top = py - ph - 16;
    left = Math.max(8, Math.min(rect.width - pw - 8, left));
    if (top < 8) top = py + 18;
    this.pop.style.left = left + "px";
    this.pop.style.top = top + "px";
  };

  TripMap.prototype.closePop = function () {
    this.pop.hidden = true;
    this._popTarget = null;
    this.selectedPoi = null;
    this.gPins.querySelectorAll("circle.pin.sel").forEach(c => c.classList.remove("sel"));
  };

  // ---- pan / zoom interaction ----
  TripMap.prototype._zoomBy = function (f) {
    if (!this._view) return;
    const b = this._view, cx = b.x + b.w/2, cy = b.y + b.h/2;
    const nw = b.w*f, nh = b.h*f;
    this._setView({ x:cx-nw/2, y:cy-nh/2, w:nw, h:nh });
  };

  TripMap.prototype._wire = function () {
    const svg = this.svg, host = this.host;
    let drag = null;
    const toWorld = (clientX, clientY) => {
      const rect = host.getBoundingClientRect(), b = this._view;
      return [ b.x + (clientX-rect.left)/rect.width*b.w,
               b.y + (clientY-rect.top)/rect.height*b.h ];
    };
    host.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".map-ctl") || e.target.closest(".map-pop")) return;
      // Don't capture yet — capturing here would steal the click from a pin.
      drag = { x:e.clientX, y:e.clientY, vx:this._view.x, vy:this._view.y, moved:false, id:e.pointerId, cap:false, onPin: !!e.target.closest("circle") };
    });
    host.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const rect = host.getBoundingClientRect(), b = this._view;
      const dx = (e.clientX-drag.x)/rect.width*b.w;
      const dy = (e.clientY-drag.y)/rect.height*b.h;
      if (!drag.moved && Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y) > 4) {
        drag.moved = true;
        try { host.setPointerCapture(drag.id); drag.cap = true; } catch (err) {}
        host.classList.add("grab");
      }
      if (drag.moved) this._setView({ x:drag.vx-dx, y:drag.vy-dy, w:b.w, h:b.h });
    });
    // A tap on empty sea closes the popup; a tap on a pin is handled by the pin.
    const end = () => {
      if (drag && !drag.moved && !drag.onPin) this.closePop();
      if (drag && drag.cap) { try { host.releasePointerCapture(drag.id); } catch (err) {} }
      drag = null; host.classList.remove("grab");
    };
    host.addEventListener("pointerup", end);
    host.addEventListener("pointercancel", end);
    host.addEventListener("wheel", (e) => {
      e.preventDefault();
      const [wx, wy] = toWorld(e.clientX, e.clientY);
      const f = e.deltaY > 0 ? 1.12 : 0.89;
      const b = this._view;
      const nw = b.w*f, nh = b.h*f;
      // zoom toward cursor
      this._setView({
        x: wx - (wx-b.x)*(nw/b.w),
        y: wy - (wy-b.y)*(nh/b.h),
        w: nw, h: nh
      });
    }, { passive:false });
  };

  window.TripMap = TripMap;
  window.MAP_CATS = CAT;
  window.GEO_DIST = dist;   // haversine (km) — reused for journey stats
})();


/* ==== app.js ==== */
/* ============================================================
   App shell — tabs, Today, Plan, Map, Money, Tips.
   State (checklist, FX overrides) persists in localStorage.
   ============================================================ */
(function () {
  const T = window.TRIP, POI = T.pois;
  const view = document.getElementById("view");
  const tabbar = document.getElementById("tabbar");
  const $ = (s, r) => (r || document).querySelector(s);

  // ---- persisted state ----
  const LS = {
    get(k, d) { try { const v = localStorage.getItem("ph_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("ph_" + k, JSON.stringify(v)); } catch (e) {} }
  };
  const state = {
    checks: LS.get("checks", {}),
    fx: Object.assign({}, T.meta.fx, LS.get("fx", {})),
    fxFrom: LS.get("fxFrom", "USD"),
    fxTo: LS.get("fxTo", "PHP"),
    quests: LS.get("quests", {}),   // {questId: true}
    packs: LS.get("packs", {}),     // {"group|item": true}
    saved: LS.get("saved", []),     // [{id,kind,text,url,poi,ts}]
    memories: LS.get("memories", []), // [{id,ts,title,note,questId,photo(idbKey)}]
    kitOpen: LS.get("kitOpen", "quests"),
    tab: "today"
  };

  /* ---- IndexedDB photo store (blobs kept out of localStorage's ~5MB cap) ---- */
  const IDB = (function () {
    let dbp;
    function db() {
      if (!dbp) dbp = new Promise((res, rej) => {
        try {
          const r = indexedDB.open("phtrip", 1);
          r.onupgradeneeded = () => r.result.createObjectStore("photos");
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) { rej(e); }
      });
      return dbp;
    }
    return {
      async put(k, blob) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("photos", "readwrite"); t.objectStore("photos").put(blob, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
      async get(k) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction("photos", "readonly"); const q = t.objectStore("photos").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
      async del(k) { const d = await db(); return new Promise((res) => { const t = d.transaction("photos", "readwrite"); t.objectStore("photos").delete(k); t.oncomplete = res; t.onerror = res; }); }
    };
  })();

  // Downscale a photo client-side so memories stay light and fully local.
  function downscale(file, max, q) {
    return new Promise((res) => {
      const img = new Image(), url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        let w = img.width, h = img.height;
        const s = Math.min(1, (max || 900) / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        c.toBlob(b => res(b), "image/jpeg", q || 0.72);
      };
      img.onerror = () => res(null);
      img.src = url;
    });
  }
  function pickPhoto(cb) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*"; inp.setAttribute("capture", "environment");
    inp.onchange = () => cb(inp.files && inp.files[0] ? inp.files[0] : null);
    inp.click();
  }
  async function storePhoto(file) {
    if (!file) return null;
    try { const b = await downscale(file); if (!b) return null; const key = "p" + Date.now() + Math.floor(Math.random()*99); await IDB.put(key, b); return key; }
    catch (e) { return null; }
  }
  function addMemory(m) {
    m.id = "m" + Date.now() + Math.floor(Math.random()*99); m.ts = m.ts || Date.now();
    state.memories.unshift(m); LS.set("memories", state.memories);
  }
  async function delMemory(id) {
    const m = state.memories.find(x => x.id === id);
    if (m && m.photo) { try { await IDB.del(m.photo); } catch (e) {} }
    state.memories = state.memories.filter(x => x.id !== id); LS.set("memories", state.memories);
  }
  // Attach a photo to a quest and mark it done — the "capture the moment" loop.
  function questPhoto(q, after) {
    pickPhoto(async (file) => {
      const key = await storePhoto(file);
      if (!state.quests[q.id]) toggleQuest(q.id);
      addMemory({ title: q.t, questId: q.id, note: "", photo: key });
      toast(key ? "Memory saved" : "Quest complete");
      if (after) after();
    });
  }

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const icon = (n, cls) => `<svg class="ic${cls ? " " + cls : ""}" aria-hidden="true"><use href="#i-${n}"/></svg>`;

  // ---- dates / countdown ----
  const DEPART = new Date("2027-02-12T00:00:00");
  const TRIP_START = new Date("2027-02-13T00:00:00");
  function todayIndex() {
    // Which day of the trip is "today"? clamp to schedule. Uses real date.
    const now = new Date();
    const diff = Math.floor((now - DEPART) / 86400000);
    if (diff < 0) return -1;               // before trip
    if (diff >= T.days.length) return T.days.length; // after
    return diff;
  }
  function fmtCountdown() {
    const now = new Date();
    const d = Math.ceil((DEPART - now) / 86400000);
    if (d > 1) return "✈ " + d + " days";
    if (d === 1) return "✈ tomorrow!";
    const idx = todayIndex();
    if (idx >= 0 && idx < T.days.length) return "Day " + (idx + 1) + "/" + T.days.length;
    return "Home";
  }

  // ---- top bar ----
  $("#tbTitle").textContent = "Philippines";
  $("#tbSub").textContent = T.meta.dates;
  function paintTop() {
    $("#countdown").textContent = fmtCountdown();
    paintRail();
    const off = !navigator.onLine;
    $("#netDot").classList.toggle("off", off);
    $("#netDot").title = off ? "offline — cached & ready" : "online";
  }
  window.addEventListener("online", paintTop);
  window.addEventListener("offline", paintTop);

  // ---- money helpers ----
  function toPHP(v, cur) { return v * (state.fx[cur] || 1); }
  function conv(v, from, to) { return toPHP(v, from) / (state.fx[to] || 1); }
  const money = (v, cur) => {
    const sym = { PHP:"₱", USD:"$", ILS:"₪" }[cur] || "";
    return sym + (Math.round(v)).toLocaleString();
  };

  /* ======================= gamification ======================= */
  const QCAT = { photo:{n:"camera",c:"var(--brass)"}, do:{n:"wave",c:"var(--accent)"},
                 culture:{n:"chat",c:"var(--plum)"}, rest:{n:"moon",c:"var(--ok)"} };
  const questsFor = (hub) => T.quests.filter(q => q.hub === hub);
  function questStats() {
    const done = T.quests.filter(q => state.quests[q.id]);
    const pts = done.reduce((s, q) => s + q.pts, 0);
    const total = T.quests.reduce((s, q) => s + q.pts, 0);
    return { count: done.length, of: T.quests.length, pts, total };
  }
  function toggleQuest(id) {
    state.quests[id] = !state.quests[id];
    LS.set("quests", state.quests);
  }
  // Personalised nudge from the day's character.
  const NUDGE = {
    highlight:{n:"flag",t:"Big one today",b:"One of the big ones. Go early, beat the boats, get the shot."},
    dive:{n:"wave",t:"Adventure day",b:"Adrenaline day. Water, sunscreen, then send it."},
    beach:{n:"sun",t:"Slow it down",b:"Sand day. Swim, read, chase the light. Nowhere to be."},
    rest:{n:"moon",t:"Recharge",b:"Resting is part of the plan. Journal, nap, do nothing on purpose."},
    expedition:{n:"boat",t:"Off the grid",b:"No signal out here, and that's the point. Phone away, eyes up."},
    travel:{n:"anchor",t:"Moving day",b:"Moving day. Snacks, water, a good playlist. Save your legs."},
    transit:{n:"plane",t:"On the move",b:"Long haul. Sleep when you can — the islands are close."}
  };

  /* A small celebration burst in the Philippine flag colours.
     Purpose-built (~1.5 KB) instead of pulling a 25 KB confetti library —
     the app has to boot with no signal. Silent under reduced-motion. */
  function celebrate(originEl) {
    if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = originEl ? originEl.getBoundingClientRect() : null;
    const ox = r ? r.left + r.width / 2 : innerWidth / 2;
    const oy = r ? r.top + r.height / 2 : innerHeight / 3;
    const cv = document.createElement("canvas");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60";
    document.body.appendChild(cv);
    const g = cv.getContext("2d"); g.scale(dpr, dpr);
    const COLORS = ["#fcd116", "#ffffff", "#0038a8", "#ce1126", "#3fd9e4"];
    const bits = [];
    for (let i = 0; i < 34; i++) {
      const a = (Math.PI * 2 * i) / 34 + Math.random() * 0.4;
      const sp = 3.2 + Math.random() * 4.2;
      bits.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
                  s: 4 + Math.random() * 4, rot: Math.random() * 6.28,
                  vr: (Math.random() - .5) * .3, c: COLORS[i % COLORS.length], life: 1 });
    }
    let raf;
    const t0 = performance.now();
    (function frame(t) {
      const dt = Math.min(32, t - (frame.last || t)); frame.last = t;
      g.clearRect(0, 0, innerWidth, innerHeight);
      let alive = false;
      for (const b of bits) {
        b.vy += 0.16 * (dt / 16); b.vx *= 0.995;
        b.x += b.vx * (dt / 16); b.y += b.vy * (dt / 16);
        b.rot += b.vr; b.life -= 0.008 * (dt / 16);
        if (b.life > 0 && b.y < innerHeight + 40) {
          alive = true;
          g.save(); g.translate(b.x, b.y); g.rotate(b.rot);
          g.globalAlpha = Math.max(0, Math.min(1, b.life));
          g.fillStyle = b.c; g.fillRect(-b.s / 2, -b.s / 2, b.s, b.s * 0.6);
          g.restore();
        }
      }
      if (alive && t - t0 < 2600) raf = requestAnimationFrame(frame);
      else { cancelAnimationFrame(raf); cv.remove(); }
    })(performance.now());
  }

  /* ======================= saved / vault ======================= */
  function addSaved(item) {
    item.id = "s" + Date.now() + Math.floor(Math.random()*99);
    item.ts = Date.now();
    state.saved.unshift(item);
    LS.set("saved", state.saved);
  }
  function delSaved(id) {
    state.saved = state.saved.filter(s => s.id !== id);
    LS.set("saved", state.saved);
  }
  function toast(msg) {
    let el = $("#toast");
    if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
    el.textContent = msg; el.classList.add("show");
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 2200);
  }
  // Save-place hook used by the map popup
  window.__savePlace = (id) => {
    const p = POI[id]; if (!p) return;
    if (state.saved.some(s => s.poi === id)) { toast("Already saved"); return; }
    addSaved({ kind:"place", text:p.name, url:p.url || ("https://www.google.com/maps/search/?api=1&query="+p.lat+","+p.lng), poi:id });
    toast("Saved to your list");
  };

  /* ======================= calendar (.ics) ======================= */
  function isoForDay(i) {
    const d = new Date(DEPART.getTime() + i * 86400000);
    return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  }
  function buildICS() {
    const nl = "\r\n";
    let out = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PH Trip//EN","CALSCALE:GREGORIAN"].join(nl) + nl;
    T.days.forEach((d, i) => {
      const start = isoForDay(i), end = isoForDay(i + 1);
      const hub = T.hubs.find(h => h.id === d.hub);
      out += ["BEGIN:VEVENT",
        "UID:phtrip-" + i + "@local",
        "DTSTART;VALUE=DATE:" + start,
        "DTEND;VALUE=DATE:" + end,
        "SUMMARY:" + icsEsc((hub?("["+hub.name+"] "):"") + d.title),
        "DESCRIPTION:" + icsEsc(d.body),
        "END:VEVENT"].join(nl) + nl;
    });
    out += "END:VCALENDAR" + nl;
    return out;
  }
  const icsEsc = (s) => String(s).replace(/[\\,;]/g, m => "\\" + m).replace(/\n/g, "\\n");
  function downloadICS() {
    const ics = buildICS();
    // A blob download works locally and on a normal host, but is blocked when
    // the page runs inside a sandboxed frame (the hosted preview). Rather than
    // leave a button that silently does nothing, fall back to the clipboard.
    const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
    if (!framed) {
      try {
        const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
        const a = document.createElement("a");
        a.href = url; a.download = "philippines-2027.ics";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        toast("Calendar file ready");
        return;
      } catch (e) { /* fall through to clipboard */ }
    }
    const done = () => toast("Calendar copied — save as philippines-2027.ics");
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ics).then(done, () => legacyCopy(ics, done));
    } else legacyCopy(ics, done);
  }
  function legacyCopy(text, ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove(); ok();
    } catch (e) { toast("Couldn't copy the calendar here"); }
  }

  /* ======================= TODAY ======================= */
  /* The hero scene: sky, the 8-ray Philippine sun, islands, moving water.
     Pure inline SVG so it works offline; motion is disabled by

      <circle class="sun-glow" cx="320" cy="52" r="86"/>

      <!-- islands on the horizon -->

      </g>
      <g class="palm">
        <path d="M72 140 q3 12 1 26"/><path d="M72 140 q-13-7-19-2"/>
        <path d="M72 140 q13-7 19-2"/><path d="M72 140 q-6-13 1-17"/>
        <path d="M300 134 q3 14 1 30"/><path d="M300 134 q-14-8-21-2"/>
        <path d="M300 134 q14-8 21-2"/><path d="M300 134 q-6-14 1-18"/>
      </g>

      <!-- water: three drifting bands -->
      <g>
        <path class="wave w1" fill="url(#seaG)" opacity=".95"
          d="M0 186 q50-15 100 0 t100 0 t100 0 t100 0 t100 0 V240 H0 Z"/>
        <path class="wave w2" fill="#0f6f9e" opacity=".5"
